name: Send Douyin Messages
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只验证登录及好友（默认不发送）'
        type: boolean
        default: true
      approved_test:
        description: '本次已授权的单好友微笑测试（永久只允许执行一次）'
        type: boolean
        default: false
  schedule:
    - cron: '30 14 * * *'
      timezone: 'Asia/Shanghai'
concurrency:
  group: douyin-daily-sender
  cancel-in-progress: false
permissions:
  contents: write # atomic daily reservation refs; no other permissions
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run with explicit gates
        shell: bash
        env:
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          DOUYIN_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
          GH_GUARD_TOKEN: ${{ github.token }}
          GITHUB_DAILY_GUARD: 'true'
          HEADLESS: 'true'
          BROWSER_CHANNEL: 'chromium'
          NETWORK_DIAGNOSTICS: 'true'
          TRACE: 'false'
          PRODUCTION_ENABLED: ${{ vars.PRODUCTION_ENABLED }}
          LIVE_TEST_ENABLED: ${{ vars.LIVE_TEST_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          APPROVED_TEST: ${{ inputs.approved_test }}
        run: |
          set -eu
          test -n "$DOUYIN_COOKIE" && test -n "$DOUYIN_CONFIG" || { echo '缺少必要 Secrets'; exit 1; }
          umask 077
          printf '%s' "$DOUYIN_CONFIG" > config.json
          if [[ "$EVENT_NAME" == 'schedule' && "$PRODUCTION_ENABLED" == 'true' ]]; then
            python run.py
          elif [[ "$EVENT_NAME" == 'workflow_dispatch' && "$INPUT_DRY_RUN" == 'false' && "$APPROVED_TEST" == 'true' ]]; then
            LIVE_SINGLE_TARGET=true APPROVED_TEST_ID=20261101-full-chromium-test-1 python run.py
          elif [[ "$EVENT_NAME" == 'workflow_dispatch' && "$INPUT_DRY_RUN" == 'false' && "$LIVE_TEST_ENABLED" == 'true' ]]; then
            LIVE_SINGLE_TARGET=true python run.py
          else
            python run.py --dry-run
          fi

